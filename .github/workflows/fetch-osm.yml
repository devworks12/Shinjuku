name: Fetch OSM data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_osm.py
      - .github/workflows/fetch-osm.yml

permissions:
  contents: write

concurrency:
  group: fetch-osm
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Overpass
        run: python3 tools/fetch_osm.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: OSMデータを更新"
          git pull --rebase origin main
          git push origin HEAD:main
